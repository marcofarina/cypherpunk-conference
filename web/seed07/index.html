<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MEM-CACHE // 0xC1PH3R</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Share+Tech+Mono&family=VT323&display=swap');

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0a0a;
            --green: #00ff41;
            --green-dim: #00cc33;
            --green-dark: #003300;
            --amber: #ffb000;
            --amber-dim: #cc8800;
            --red: #ff2020;
            --red-dim: #cc1a1a;
            --crt-line: rgba(0, 255, 65, 0.03);
            --panel-bg: #111;
            --panel-border: #1a1a1a;
            --btn-bg: #1a1a0a;
            --btn-border: #3a3a1a;
        }

        html,
        body {
            background: var(--bg);
            color: var(--green);
            font-family: 'JetBrains Mono', 'Share Tech Mono', monospace;
            min-height: 100dvh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg,
                    var(--crt-line) 0px,
                    var(--crt-line) 1px,
                    transparent 1px,
                    transparent 3px);
            pointer-events: none;
            z-index: 9999;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            min-height: 100dvh;
        }

        /* --- HEADER --- */
        .header {
            text-align: center;
            width: 100%;
        }

        .header h1 {
            font-family: 'VT323', monospace;
            font-size: 1.6rem;
            color: var(--amber);
            letter-spacing: 0.15em;
            text-shadow: 0 0 8px rgba(255, 176, 0, 0.4);
            margin-bottom: 4px;
        }

        .header .subtitle {
            font-size: 0.65rem;
            color: var(--green-dim);
            opacity: 0.6;
            letter-spacing: 0.1em;
        }

        /* --- STAGE TRACKER --- */
        .stage-tracker {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 8px 0;
        }

        .stage-pip {
            width: 36px;
            height: 8px;
            border: 1px solid var(--green-dark);
            background: transparent;
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        .stage-pip.completed {
            background: var(--green);
            border-color: var(--green);
            box-shadow: 0 0 6px rgba(0, 255, 65, 0.5);
        }

        .stage-pip.active {
            border-color: var(--amber);
            background: rgba(255, 176, 0, 0.2);
            animation: pip-pulse 1.2s ease-in-out infinite;
        }

        @keyframes pip-pulse {

            0%,
            100% {
                box-shadow: 0 0 4px rgba(255, 176, 0, 0.3);
            }

            50% {
                box-shadow: 0 0 10px rgba(255, 176, 0, 0.6);
            }
        }

        .stage-label {
            font-size: 0.7rem;
            color: var(--amber-dim);
            letter-spacing: 0.1em;
            margin-bottom: 2px;
            text-align: center;
        }

        /* --- GLOBAL TIMER --- */
        .global-timer {
            font-family: 'VT323', monospace;
            font-size: 2rem;
            color: var(--amber);
            letter-spacing: 0.12em;
            text-shadow: 0 0 8px rgba(255, 176, 0, 0.4);
            text-align: center;
            transition: color 0.3s, text-shadow 0.3s;
        }

        .global-timer.critical {
            color: var(--red);
            text-shadow: 0 0 12px rgba(255, 32, 32, 0.5);
            animation: timer-blink 0.8s ease-in-out infinite;
        }

        @keyframes timer-blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* --- DISPLAY PANEL --- */
        .display-panel {
            width: 200px;
            height: 160px;
            background: #050505;
            border: 3px solid #2a2a2a;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow:
                inset 0 0 30px rgba(0, 0, 0, 0.8),
                0 0 15px rgba(0, 255, 65, 0.05);
        }

        .display-panel::before {
            content: '';
            position: absolute;
            inset: 4px;
            border: 1px solid #1a1a1a;
            border-radius: 3px;
            pointer-events: none;
        }

        .display-panel::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg,
                    rgba(0, 255, 65, 0.015) 0px,
                    rgba(0, 255, 65, 0.015) 1px,
                    transparent 1px,
                    transparent 2px);
            border-radius: 4px;
            pointer-events: none;
        }

        .display-number {
            font-family: 'VT323', monospace;
            font-size: 7rem;
            color: var(--green);
            text-shadow:
                0 0 20px rgba(0, 255, 65, 0.6),
                0 0 40px rgba(0, 255, 65, 0.3),
                0 0 60px rgba(0, 255, 65, 0.1);
            line-height: 1;
            transition: opacity 0.15s;
        }

        .display-number.flash {
            opacity: 0;
        }

        /* --- BUTTONS --- */
        .buttons-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
            max-width: 360px;
        }

        .mem-btn {
            flex: 1;
            max-width: 80px;
            aspect-ratio: 1;
            background: var(--btn-bg);
            border: 2px solid var(--btn-border);
            border-radius: 6px;
            color: var(--amber);
            font-family: 'VT323', monospace;
            font-size: 2.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
            position: relative;
            box-shadow: 0 3px 0 #0a0a00, 0 4px 8px rgba(0, 0, 0, 0.4);
            touch-action: manipulation;
        }

        .mem-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0a0a00, 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .mem-btn:not(.disabled):hover {
            border-color: var(--amber);
            box-shadow: 0 3px 0 #0a0a00, 0 0 12px rgba(255, 176, 0, 0.2);
        }

        .mem-btn.correct {
            border-color: var(--green);
            color: var(--green);
            background: rgba(0, 255, 65, 0.1);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
        }

        .mem-btn.wrong {
            border-color: var(--red);
            color: var(--red);
            background: rgba(255, 32, 32, 0.15);
            box-shadow: 0 0 15px rgba(255, 32, 32, 0.3);
            animation: btn-shake 0.4s ease;
        }

        .mem-btn.disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        @keyframes btn-shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-6px);
            }

            40% {
                transform: translateX(6px);
            }

            60% {
                transform: translateX(-4px);
            }

            80% {
                transform: translateX(4px);
            }
        }

        /* --- STATUS / LOG --- */
        .status-area {
            width: 100%;
            text-align: center;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .status-msg {
            font-size: 0.75rem;
            color: var(--green-dim);
            letter-spacing: 0.05em;
            opacity: 0.8;
            transition: color 0.3s;
        }

        .status-msg.error {
            color: var(--red);
            opacity: 1;
        }

        .status-msg.success {
            color: var(--green);
            opacity: 1;
        }

        .strikes-display {
            font-size: 0.65rem;
            color: var(--red-dim);
            letter-spacing: 0.08em;
        }

        .strikes-display .x {
            font-size: 0.8rem;
        }

        /* --- COOLDOWN OVERLAY --- */
        .cooldown-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 10, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            gap: 16px;
            padding: 20px;
            text-align: center;
        }

        .cooldown-overlay.hidden {
            display: none;
        }

        .cooldown-overlay .icon {
            font-size: 3rem;
            color: var(--red);
            text-shadow: 0 0 20px rgba(255, 32, 32, 0.4);
            animation: lock-pulse 2s ease-in-out infinite;
        }

        @keyframes lock-pulse {

            0%,
            100% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }
        }

        .cooldown-overlay .title {
            font-family: 'VT323', monospace;
            font-size: 1.4rem;
            color: var(--red);
            letter-spacing: 0.12em;
        }

        .cooldown-overlay .timer {
            font-family: 'VT323', monospace;
            font-size: 2.8rem;
            color: var(--amber);
            text-shadow: 0 0 12px rgba(255, 176, 0, 0.4);
        }

        .cooldown-overlay .hint {
            font-size: 0.65rem;
            color: var(--green-dim);
            opacity: 0.5;
            max-width: 280px;
        }

        /* --- POSITION LABELS --- */
        .position-labels {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
            max-width: 360px;
        }

        .pos-label {
            flex: 1;
            max-width: 80px;
            text-align: center;
            font-size: 0.55rem;
            color: var(--green-dark);
            letter-spacing: 0.1em;
            opacity: 0.6;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>MEM-CACHE</h1>
            <div class="subtitle">// MODULE 0xC1PH3R — SEQUENTIAL MEMORY RECOVERY //</div>
        </div>

        <div class="stage-label">STAGE <span id="stageNum">1</span> / 5</div>

        <div class="stage-tracker">
            <div class="stage-pip active" data-stage="0"></div>
            <div class="stage-pip" data-stage="1"></div>
            <div class="stage-pip" data-stage="2"></div>
            <div class="stage-pip" data-stage="3"></div>
            <div class="stage-pip" data-stage="4"></div>
        </div>

        <div class="global-timer" id="globalTimer">01:00</div>

        <div class="display-panel">
            <div class="display-number" id="displayNum">—</div>
        </div>

        <div class="position-labels">
            <div class="pos-label">POS 1</div>
            <div class="pos-label">POS 2</div>
            <div class="pos-label">POS 3</div>
            <div class="pos-label">POS 4</div>
        </div>

        <div class="buttons-row" id="buttonsRow">
            <button class="mem-btn disabled" data-pos="0">—</button>
            <button class="mem-btn disabled" data-pos="1">—</button>
            <button class="mem-btn disabled" data-pos="2">—</button>
            <button class="mem-btn disabled" data-pos="3">—</button>
        </div>

        <div class="status-area">
            <div class="status-msg" id="statusMsg">Inizializzazione modulo…</div>
            <div class="strikes-display" id="strikesDisplay"></div>
        </div>
    </div>

    <!-- COOLDOWN -->
    <div class="cooldown-overlay hidden" id="cooldownOverlay">
        <div class="icon">⛔</div>
        <div class="title">SISTEMA BLOCCATO</div>
        <div class="timer" id="cooldownTimer">--:--</div>
        <div class="hint">Troppi errori consecutivi. Il sistema si è bloccato temporaneamente per prevenire accessi non
            autorizzati.</div>
    </div>



    <script>
        'use strict';

        /* ========== CONFIG ========== */
        const TOTAL_STAGES = 5;
        const REWARD_DIGITS = [0, 7, 2, 7];
        const LS_KEY = 'c2140_mem_cd';

        const COOLDOWN_SECONDS = 30;
        const COOLDOWN_THRESHOLD = 3;
        const GLOBAL_TIME = 60;  /* seconds */

        /* ========== STATE ========== */
        let stages = [];        /* [{display, buttons, correctPos, correctLabel}] */
        let history = [];       /* [{pressedPos, pressedLabel}] */
        let currentStage = 0;
        let inputLocked = false;
        let totalErrors = 0;
        let globalTimerId = null;
        let globalSecondsLeft = GLOBAL_TIME;

        /* ========== DOM ========== */
        const $display = document.getElementById('displayNum');
        const $stageNum = document.getElementById('stageNum');
        const $buttons = document.getElementById('buttonsRow');
        const $status = document.getElementById('statusMsg');
        const $strikes = document.getElementById('strikesDisplay');
        const $cdOverlay = document.getElementById('cooldownOverlay');
        const $cdTimer = document.getElementById('cooldownTimer');
        const $gTimer = document.getElementById('globalTimer');
        const pips = document.querySelectorAll('.stage-pip');
        const btns = () => $buttons.querySelectorAll('.mem-btn');

        /* ========== UTILS ========== */
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function randInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        /* ========== RULES ENGINE ========== */
        function solveStage(stageIdx, stages, history) {
            const s = stages[stageIdx];
            const d = s.display;  /* 1-4 */
            const labels = s.buttons; /* array of labels at positions 0-3 */

            if (stageIdx === 0) {
                /* Stage 1 */
                if (d === 1) return { pos: 1 };  /* press 2nd button (0-indexed: 1) */
                if (d === 2) return { pos: 1 };
                if (d === 3) return { pos: 2 };
                if (d === 4) return { pos: 3 };
            }

            if (stageIdx === 1) {
                /* Stage 2 */
                if (d === 1) return { label: 4 };            /* button labeled "4" */
                if (d === 2) return { pos: history[0].pressedPos };  /* same position as stage 1 */
                if (d === 3) return { pos: 0 };               /* first button */
                if (d === 4) return { pos: history[0].pressedPos };
            }

            if (stageIdx === 2) {
                /* Stage 3 */
                if (d === 1) return { label: history[1].pressedLabel }; /* same label as stage 2 */
                if (d === 2) return { label: history[0].pressedLabel }; /* same label as stage 1 */
                if (d === 3) return { pos: 2 };                          /* third button */
                if (d === 4) return { label: 4 };                        /* button labeled "4" */
            }

            if (stageIdx === 3) {
                /* Stage 4 */
                if (d === 1) return { pos: history[0].pressedPos };      /* same pos as stage 1 */
                if (d === 2) return { pos: 0 };                          /* first button */
                if (d === 3) return { pos: history[1].pressedPos };      /* same pos as stage 2 */
                if (d === 4) return { pos: history[1].pressedPos };      /* same pos as stage 2 */
            }

            if (stageIdx === 4) {
                /* Stage 5 */
                if (d === 1) return { label: history[0].pressedLabel };  /* same label as stage 1 */
                if (d === 2) return { label: history[1].pressedLabel };  /* same label as stage 2 */
                if (d === 3) return { label: history[3].pressedLabel };  /* same label as stage 4 */
                if (d === 4) return { label: history[2].pressedLabel };  /* same label as stage 3 */
            }
        }

        function getCorrectPosition(stageIdx) {
            const result = solveStage(stageIdx, stages, history);
            if (result.pos !== undefined) return result.pos;
            /* Find position of button with matching label */
            const labels = stages[stageIdx].buttons;
            return labels.indexOf(result.label);
        }

        /* ========== GENERATE STAGES ========== */
        function generateStages() {
            stages = [];
            history = [];
            currentStage = 0;

            for (let i = 0; i < TOTAL_STAGES; i++) {
                stages.push({
                    display: randInt(1, 4),
                    buttons: shuffle([1, 2, 3, 4])
                });
            }

            /* Validate solvability — each stage must have a findable correct button.
               For stages referencing history, we simulate forward. */
            for (let i = 0; i < TOTAL_STAGES; i++) {
                const correctPos = (() => {
                    const result = solveStage(i, stages, history);
                    if (result.pos !== undefined) return result.pos;
                    return stages[i].buttons.indexOf(result.label);
                })();

                if (correctPos < 0 || correctPos > 3) {
                    /* Shouldn't happen with labels [1-4], but regenerate if so */
                    return generateStages();
                }

                history.push({
                    pressedPos: correctPos,
                    pressedLabel: stages[i].buttons[correctPos]
                });
            }

            /* Reset history for actual play */
            history = [];
        }

        /* ========== RENDER ========== */
        function renderStage() {
            const s = stages[currentStage];

            /* Display number with flash effect */
            $display.style.color = '';
            $display.classList.add('flash');
            setTimeout(() => {
                $display.textContent = s.display;
                $display.classList.remove('flash');
            }, 120);

            /* Buttons */
            const buttons = btns();
            buttons.forEach((btn, i) => {
                btn.textContent = s.buttons[i];
                btn.dataset.pos = i;
                btn.dataset.label = s.buttons[i];
                btn.className = 'mem-btn';
                btn.style.fontSize = '';
                btn.style.pointerEvents = '';
            });

            /* Stage label */
            $stageNum.textContent = currentStage + 1;

            /* Pips */
            pips.forEach((pip, i) => {
                pip.className = 'stage-pip';
                if (i < currentStage) pip.classList.add('completed');
                else if (i === currentStage) pip.classList.add('active');
            });

            /* Status */
            $status.textContent = `Analizza il display. Seleziona il pulsante corretto.`;
            $status.className = 'status-msg';

            inputLocked = false;
        }

        function renderStrikes() {
            if (totalErrors === 0) {
                $strikes.innerHTML = '';
                return;
            }
            const xs = Array.from({ length: totalErrors }, () => '<span class="x">✘</span>').join(' ');
            $strikes.innerHTML = `ERRORI: ${xs}`;
        }

        /* ========== COOLDOWN ========== */
        function getCooldownData() {
            try {
                const raw = localStorage.getItem(LS_KEY);
                if (!raw) return null;
                return JSON.parse(raw);
            } catch { return null; }
        }

        function saveCooldownData(unlocksAt) {
            try {
                localStorage.setItem(LS_KEY, JSON.stringify({ unlocksAt }));
            } catch { }
        }

        function clearCooldown() {
            try { localStorage.removeItem(LS_KEY); } catch { }
        }

        function checkCooldown() {
            const data = getCooldownData();
            if (!data || !data.unlocksAt) return false;

            if (Date.now() < data.unlocksAt) {
                showCooldownScreen(data.unlocksAt);
                return true;
            }
            /* Cooldown expired — clear it */
            clearCooldown();
            return false;
        }

        function showCooldownScreen(unlocksAt) {
            $cdOverlay.classList.remove('hidden');
            inputLocked = true;
            stopGlobalTimer();

            const tick = () => {
                const remaining = Math.max(0, unlocksAt - Date.now());
                if (remaining <= 0) {
                    $cdOverlay.classList.add('hidden');
                    clearCooldown();
                    /* Reset errors after cooldown served */
                    totalErrors = 0;
                    renderStrikes();
                    inputLocked = false;
                    startRound();
                    return;
                }
                const secs = Math.ceil(remaining / 1000);
                $cdTimer.textContent = `00:${String(secs).padStart(2, '0')}`;
                requestAnimationFrame(tick);
            };
            tick();
        }

        function triggerCooldown() {
            if (totalErrors >= COOLDOWN_THRESHOLD) {
                const unlocksAt = Date.now() + COOLDOWN_SECONDS * 1000;
                saveCooldownData(unlocksAt);
                showCooldownScreen(unlocksAt);
            }
        }

        /* ========== GLOBAL TIMER ========== */
        function renderGlobalTimer() {
            const mins = Math.floor(globalSecondsLeft / 60);
            const secs = globalSecondsLeft % 60;
            $gTimer.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

            if (globalSecondsLeft <= 10) {
                $gTimer.classList.add('critical');
            } else {
                $gTimer.classList.remove('critical');
            }
        }

        function startGlobalTimer() {
            stopGlobalTimer();
            globalSecondsLeft = GLOBAL_TIME;
            $gTimer.style.color = '';
            $gTimer.style.textShadow = '';
            $gTimer.classList.remove('critical');
            renderGlobalTimer();

            globalTimerId = setInterval(() => {
                globalSecondsLeft--;
                renderGlobalTimer();

                if (globalSecondsLeft <= 0) {
                    stopGlobalTimer();
                    onGlobalTimeout();
                }
            }, 1000);
        }

        function stopGlobalTimer() {
            if (globalTimerId !== null) {
                clearInterval(globalTimerId);
                globalTimerId = null;
            }
        }

        function onGlobalTimeout() {
            inputLocked = true;
            btns().forEach(b => b.classList.add('disabled'));

            $display.textContent = '✗';
            $display.style.color = 'var(--red)';
            $status.textContent = 'Tempo scaduto. Reset del modulo…';
            $status.className = 'status-msg error';

            totalErrors++;
            renderStrikes();

            setTimeout(() => {
                $display.style.color = '';
                generateStages();
                triggerCooldown();
                if (!$cdOverlay.classList.contains('hidden')) return;
                startRound();
            }, 1800);
        }

        /* ========== START ROUND (generate + timer) ========== */
        function startRound() {
            generateStages();
            renderStage();
            startGlobalTimer();
        }

        /* ========== BUTTON HANDLER ========== */
        function handlePress(posIdx) {
            if (inputLocked) return;
            inputLocked = true;

            const correctPos = getCorrectPosition(currentStage);
            const pressedLabel = stages[currentStage].buttons[posIdx];
            const btn = btns()[posIdx];

            if (posIdx === correctPos) {
                /* Correct */
                btn.classList.add('correct');
                history.push({ pressedPos: posIdx, pressedLabel });

                $status.textContent = `Stage ${currentStage + 1} superato.`;
                $status.className = 'status-msg success';

                /* Mark pip completed */
                pips[currentStage].className = 'stage-pip completed';

                currentStage++;

                if (currentStage >= TOTAL_STAGES) {
                    /* WIN */
                    setTimeout(showSuccess, 600);
                    return;
                }

                setTimeout(() => renderStage(), 700);

            } else {
                /* Wrong */
                btn.classList.add('wrong');
                totalErrors++;
                renderStrikes();

                $status.textContent = `Errore. Reset allo stage 1.`;
                $status.className = 'status-msg error';

                /* Disable all buttons during reset */
                btns().forEach(b => b.classList.add('disabled'));

                setTimeout(() => {
                    generateStages();
                    triggerCooldown();
                    if (!$cdOverlay.classList.contains('hidden')) return;
                    renderStage();
                    startGlobalTimer();  /* fresh 60s for new attempt */
                }, 1200);
            }
        }

        /* ========== SUCCESS ========== */
        function showSuccess() {
            clearCooldown();
            stopGlobalTimer();
            inputLocked = true;

            /* Flash display */
            $display.textContent = '✓';
            $display.style.color = 'var(--green)';

            /* Show digits on the four buttons */
            const buttons = btns();
            buttons.forEach((btn, i) => {
                btn.className = 'mem-btn correct';
                btn.textContent = REWARD_DIGITS[i];
                btn.style.fontSize = '2.4rem';
                btn.style.pointerEvents = 'none';
            });

            /* All pips completed */
            pips.forEach(p => p.className = 'stage-pip completed');

            /* Timer frozen — show remaining time in green */
            $gTimer.classList.remove('critical');
            $gTimer.style.color = 'var(--green)';
            $gTimer.style.textShadow = '0 0 12px rgba(0, 255, 65, 0.5)';

            /* Status */
            $status.textContent = 'MODULO DISARMATO — INDICE RECUPERATO';
            $status.className = 'status-msg success';
            $stageNum.textContent = '✓';
        }

        /* ========== INIT ========== */
        function init() {
            if (checkCooldown()) {
                generateStages();
                return;
            }

            renderStrikes();
            setTimeout(() => startRound(), 400);
        }

        /* Event delegation for buttons */
        $buttons.addEventListener('click', (e) => {
            const btn = e.target.closest('.mem-btn');
            if (!btn || btn.classList.contains('disabled')) return;
            handlePress(parseInt(btn.dataset.pos, 10));
        });

        init();
    </script>
</body>

</html>
